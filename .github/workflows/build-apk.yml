name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install web tooling
        run: npm ci

      - name: Stamp build number into the UI
        run: echo "window.BUILD = '${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7})';" > www/version.js

      - name: Copy web UI into the Android project
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk radio-alarm.apk

      - uses: actions/upload-artifact@v5
        with:
          name: radio-alarm-apk
          path: radio-alarm.apk

      - name: Publish as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${GITHUB_RUN_NUMBER}" radio-alarm.apk \
            --title "Build ${GITHUB_RUN_NUMBER}" \
            --notes "Automatic build of ${GITHUB_SHA::7}." \
            --target "${GITHUB_SHA}" \
            --latest
