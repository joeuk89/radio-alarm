name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install web tooling
        run: npm ci

      - name: Stamp build number into the UI
        run: echo "window.BUILD = '${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7})';" > www/version.js

      - name: Copy web UI into the Android project
        run: npx cap sync android

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIDELOAD_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SIDELOAD_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Signing secrets are missing. Add SIDELOAD_KEYSTORE_B64 and SIDELOAD_KEYSTORE_PASSWORD (see README)."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/app/sideload.keystore

      - name: Build APK
        working-directory: android
        env:
          SIDELOAD_KEYSTORE_PASSWORD: ${{ secrets.SIDELOAD_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Show signing certificate
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | grep "SHA-256"

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk radio-alarm.apk

      - uses: actions/upload-artifact@v5
        with:
          name: radio-alarm-apk
          path: radio-alarm.apk

      - name: Publish as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${GITHUB_RUN_NUMBER}" radio-alarm.apk \
            --title "Build ${GITHUB_RUN_NUMBER}" \
            --notes "Automatic build of ${GITHUB_SHA::7}." \
            --target "${GITHUB_SHA}" \
            --latest
